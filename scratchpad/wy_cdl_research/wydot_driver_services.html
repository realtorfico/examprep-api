<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow"/>
    <link rel="stylesheet" href="/css/errors.css" type="text/css"/>
    <link rel="stylesheet" href="https://www.dot.state.wy.us/modules/whp/css/style.css" type="text/css"/>
    <link rel="stylesheet" href="https://www.dot.state.wy.us/modules/whp/css/font-awesome.css" type="text/css"/>
    <title>404 - Page not found</title>
</head>
<body class="body-bg error-page" onLoad="if (history.length > 1) { document.getElementById('backLink').style.display=''; }">
    <div class="row-fluid login-wrapper">
        <div class="span4 box error-box">
            <div class="content-wrap">
                <h1 class="message-big">404 - Page not found</h1>
                <p>The file that you requested could not be found on this server.</p>
                <p id="backLink" style="display:none">
                    <a class="btn btn-large btn-block" href="javascript:history.back()">
                        <i class="fa fa-chevron-left"></i>
                        &nbsp;Click
                        &nbsp;here
                        &nbsp;to go back.</a>
                </p>
                <p>Click here to return to the home page</p>
                <a class="btn btn-large btn-block btn-primary" href="/">
                    <i class="fa fa-home"></i>
                    &nbsp;Homepage</a>
                
                <div class="info">
                  <p class="label">For road conditions and travel info go to:</p>
                  <p class="links"><a href="http://wyoroad.info" title="Wyoming Road And Travel Information">www.wyoroad.info</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
